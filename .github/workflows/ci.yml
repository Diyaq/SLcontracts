name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --verbose
        env:
          RUST_BACKTRACE: 1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  panic-message-style:
    name: Panic Message Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check panic message style
        run: |
          status=0
          while IFS= read -r line; do
            file="${line%%:*}"
            rest="${line#*:}"
            lineno="${rest%%:*}"
            msg="${rest#*:}"
            literal=$(printf '%s' "$msg" | sed -n 's/.*"\(.*\)".*/\1/p')
            [ -z "$literal" ] && continue
            if printf '%s' "$literal" | grep -q '\.$'; then
              echo "$file:$lineno: panic message must not end with a period: $literal"
              status=1
            fi
            if printf '%s' "$literal" | grep -q '^[A-Z]'; then
              echo "$file:$lineno: panic message must start lowercase: $literal"
              status=1
            fi
          done < <(grep -rnE 'panic!\(' --include='lib.rs' contracts/sorobanlard/src)
          exit $status

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          fail_ci_if_error: false

  wasm-build:
    name: WASM Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build WASM contracts
        run: make build
      - name: Check optimized WASM size
        run: |
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            size=$(stat -f%z "$wasm" 2>/dev/null || stat -c%s "$wasm" 2>/dev/null)
            name=$(basename "$wasm")
            echo "$name: $size bytes"
            if [ "$size" -gt 262144 ]; then
              echo "ERROR: $name exceeds 256 KiB limit"
              exit 1
            fi
          done

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Reads Cargo.lock and .cargo/audit.toml. Policy for advisories with no fix
      # is documented in CONTRIBUTING.md.
      - name: Audit Cargo.lock against RustSec
        run: cargo audit

  readme-api:
    name: README API Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README references match lib.rs signatures
        run: python3 scripts/check_readme_api.py
