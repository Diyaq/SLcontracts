name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/setup-rust@master
        with:
          rust-version: stable
      - run: cargo test --verbose
        env:
          RUST_BACKTRACE: 1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/setup-rust@master
        with:
          rust-version: stable
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/setup-rust@master
        with:
          rust-version: stable
      - run: cargo fmt --all -- --check

  datakey-variant-limit:
    name: DataKey Variant Limit Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warn when DataKey / DataKey2 approach the 50-variant limit
        run: |
          # The #[contracttype] macro supports at most 50 variants per enum.
          # lib.rs splits storage keys across DataKey and DataKey2 to stay under
          # this limit. This check warns when either enum approaches the cap so
          # contributors know to introduce the next overflow enum (DataKey3...).
          LIMIT=50
          WARN_THRESHOLD=45
          status=0
          for enum in DataKey DataKey2; do
            count=$(awk "/pub enum $enum[[:space:]]*\{/{flag=1;next} flag&&/^[[:space:]]*\}/{flag=0} flag" lib.rs \
              | grep -E '^[[:space:]]*[A-Z][A-Za-z0-9_]*' \
              | grep -vE '^[[:space:]]*//' \
              | wc -l | tr -d ' ')
            echo "$enum: $count variants (limit $LIMIT, warn at $WARN_THRESHOLD)"
            if [ "$count" -ge "$LIMIT" ]; then
              echo "::error::$enum has $count variants, exceeding the $LIMIT-variant #[contracttype] limit. Introduce a new overflow enum (e.g. DataKey3) and migrate new keys there."
              status=1
            elif [ "$count" -ge "$WARN_THRESHOLD" ]; then
              echo "::warning::$enum has $count variants, approaching the $LIMIT-variant #[contracttype] limit. Plan to add the next overflow enum (e.g. DataKey3) before adding more keys."
            fi
          done
          exit $status

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/setup-rust@master
        with:
          rust-version: stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          fail_ci_if_error: false

  wasm-build:
    name: WASM Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/setup-rust@master
        with:
          rust-version: stable
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build WASM contracts
        run: make build
      - name: Check optimized WASM size
        run: |
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            size=$(stat -f%z "$wasm" 2>/dev/null || stat -c%s "$wasm" 2>/dev/null)
            name=$(basename "$wasm")
            echo "$name: $size bytes"
            if [ "$size" -gt 262144 ]; then
              echo "ERROR: $name exceeds 256 KiB limit"
              exit 1
            fi
          done
