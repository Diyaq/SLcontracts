name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/setup-rust@master
        with:
          rust-version: stable
      - run: cargo test --verbose
        env:
          RUST_BACKTRACE: 1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/setup-rust@master
        with:
          rust-version: stable
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/setup-rust@master
        with:
          rust-version: stable
      - run: cargo fmt --all -- --check

  docs-lint:
    name: Docs Lint (architecture diagram)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README architecture diagram covers all subsystems
        run: |
          set -euo pipefail
          if [ ! -f README.md ]; then
            echo "ERROR: README.md not found"
            exit 1
          fi
          if ! grep -q 'Architecture' README.md; then
            echo "ERROR: README.md is missing an Architecture section"
            exit 1
          fi
          missing=0
          for subsystem in "Course Registry" "Enrollment" "Payment" "Certificate" "Arbitration" "Waitlist" "Fee"; do
            if ! grep -qi "$subsystem" README.md; then
              echo "ERROR: README architecture diagram is missing subsystem: $subsystem"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Update the architecture diagram in README.md to include all subsystems."
            exit 1
          fi
          echo "README architecture diagram references all required subsystems."

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/setup-rust@master
        with:
          rust-version: stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          fail_ci_if_error: false

  wasm-build:
    name: WASM Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/setup-rust@master
        with:
          rust-version: stable
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build WASM contracts
        run: make build
      - name: Check optimized WASM size
        run: |
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            size=$(stat -f%z "$wasm" 2>/dev/null || stat -c%s "$wasm" 2>/dev/null)
            name=$(basename "$wasm")
            echo "$name: $size bytes"
            if [ "$size" -gt 262144 ]; then
              echo "ERROR: $name exceeds 256 KiB limit"
              exit 1
            fi
          done
