[package]
name = "sorobanlard"
version = "0.1.0"
edition = "2021"
publish = false
description = "SorobanLard — On-chain course enrollment, payments, and certificate issuance on Stellar Soroban"
authors = ["SorobanLard Team"]

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
